services:
  - type: web
    name: travel-bag-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: FRONTEND_URL
        value: https://travel-bag-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: travel-bag-db
          property: connectionString
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

databases:
  - name: travel-bag-db
    databaseName: travel_bag_db
    user: bag_user
    plan: free
    region: oregon
